# Default configurations
default:
  browser: Official

# Browser repositories
browsers:
  # Fallback to camoufox org
  - repo: daijro/camoufox, camoufox/camoufox
    name: Official
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        browser:
          # Stable channel
          stable:
            min: "beta.19"
            max: "1"
          # Prerelease channel (including "alpha.*" builds) matches all versions

  - repo: coryking/camoufox
    name: CoryKing
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        # Assume all browsers

  - repo: JWriter20/camoufox
    name: JWriter20
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        # Assume all browsers

# GeoIP sources are camoucore's (camoucore/geoip.yml), shared by every launcher.
