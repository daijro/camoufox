# Default configurations
default:
  browser: Official
  geoip: GeoIP AIO by daijro

# Browser repositories
browsers:
  # Fallback to camoufox org
  - repo: daijro/camoufox, camoufox/camoufox
    name: Official
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        browser:
          # Stable channel
          stable:
            min: "beta.19"
            max: "1"
          # Prerelease channel (including "alpha.*" builds) matches all versions

  - repo: coryking/camoufox
    name: CoryKing
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        # Assume all browsers

  - repo: JWriter20/camoufox
    name: JWriter20
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        # Assume all browsers

# GeoIP database repositories
#
# Every URL points at the source's newest build, never a pinned one: the
# launcher re-downloads once the build it has is a week old (see
# needs_update() in geolocation.py), and tests/test_geoip_sources.py fails CI
# and the release when a source stops publishing.
#
# `deprecated: true` sources still work when chosen by name, with a warning.
# A cache that holds one without an explicit `camoufox set --geoip` choice
# (every install that predates the switch to AIO) moves to the default.
geoip:
  # GeoIP All-in-One - Combined IPv4/IPv6 with all fields. Merges several
  # databases per range; rebuilt weekly by daijro/geoip-all-in-one.
  - name: GeoIP AIO by daijro
    extract: true
    urls:
      combined:
        - https://github.com/daijro/geoip-all-in-one/releases/latest/download/geoip-aio-all.mmdb.zip
    paths:
      iso_code: country.iso_code
      longitude: location.longitude
      latitude: location.latitude
      timezone: location.time_zone

  # GeoLite2 City via sapics/ip-location-db, which publishes to GitHub
  # Releases since 2026-06-18 (URLs from daijro/camoufox#815).
  - name: MaxMind GeoLite2
    deprecated: true
    urls:
      ipv4:
        - https://github.com/sapics/ip-location-db/releases/download/latest/geolite2-city-ipv4.mmdb
      ipv6:
        - https://github.com/sapics/ip-location-db/releases/download/latest/geolite2-city-ipv6.mmdb
    paths:
      iso_code: country_code
      longitude: longitude
      latitude: latitude
      timezone: timezone
