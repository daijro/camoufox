# Decisions this repository has already made, and the evidence for each.
#
# Compiled from code comments, commit messages, and the issue/PR record --
# specifically from what was *rejected*, which is where the reasoning usually
# lives. A rule earns a place here when someone proposed the opposite, it was
# considered on the merits, and the answer was no. Those are the decisions that
# get re-litigated by the next well-meaning contributor, or quietly undone by an
# agent rebasing patches at 3am.
#
# `browser/tests/native/test_tribal_rules.py` asserts every entry that is mechanically
# checkable. An entry with `check: manual` is documentation only.
#
# Adding one: cite the issue, PR, or commit. "I think this is how it works" is
# not evidence, and a rule nobody can trace gets deleted the first time it is
# inconvenient.

schema: 1

rules:
  # -------------------------------------------------------------------------
  # Virtual display
  # -------------------------------------------------------------------------

  - id: virtual-display-default-1x1x24
    title: The Xvfb default screen is 1x1x24 and stays that way
    check: automated
    evidence:
      - "PR #714 (rejected): 'use 1920x1080 screen size for virtual display'"
      - "PR #724 (rejected): the same change, proposed again"
      - "issue #458: blank screenshots, the reported motivation for both"
    rationale: >-
      Proposed twice, rejected twice, on two grounds. First, it does not fix
      anything: rendering was measured identical at both sizes -- innerWidth
      1280, innerHeight 984, fullpage 1280x5367 either way, with only
      fingerprint-rotation noise in the colour count. Second, it costs
      throughput: past 30-40 concurrent browsers the framebuffer becomes the
      bottleneck on a machine that handles 70-80 at 1x1. The root window is not
      a fingerprint -- screen.* comes from the generated fingerprint, applied
      per context in the browser.
    expect:
      module: camoufox.virtdisplay
      attribute: DEFAULT_SCREEN
      equals: "1x1x24"

  - id: virtual-display-size-override-exists
    title: The screen size is overridable, just not by default
    check: automated
    evidence:
      - "PR #714 review: 'hardcoding 1920x1080 would be the wrong default'"
    rationale: >-
      The rejection was of the *default*, not the capability. Anyone who needs a
      real framebuffer sets CAMOUFOX_VIRTUAL_DISPLAY_SIZE. Removing the hatch
      would turn a settled disagreement back into an open one.
    expect:
      module: camoufox.virtdisplay
      attribute: SCREEN_ENV_VAR
      equals: CAMOUFOX_VIRTUAL_DISPLAY_SIZE

  - id: composite-extension-off
    title: The X Composite extension stays disabled by default
    check: automated
    evidence:
      - "issue #93: no video under headless='virtual'"
      - "python/src/camoufox/virtdisplay.py: the measurement table"
    rationale: >-
      Briefly enabled on the theory that disabling it caused #93. It did not --
      #93 was a Juggler bug, fixed by capturing the screencast from the
      compositor instead of libwebrtc's X11 window capturer. Measured at the
      time: Composite on + record_video_dir crashed the browser with SIGSEGV
      inside the X11 capturer. That capturer is gone, so enabling it is no
      longer dangerous, but it is no longer useful either. Off is the
      long-standing default and there is now no reason to move.
    expect:
      module: camoufox.virtdisplay
      attribute: COMPOSITE_ENV_VAR
      equals: CAMOUFOX_VIRTUAL_DISPLAY_COMPOSITE

  - id: displayfd-not-lockfile-scan
    title: Displays are claimed atomically with Xvfb -displayfd
    check: automated
    evidence:
      - "issue #597 / commit 8f9ff07"
    rationale: >-
      The old userspace lock-file scan plus random-jitter retry raced: many
      camoufox processes starting at once all saw the same free display numbers
      before any of them bound. -displayfd lets Xvfb scan up from :0 and bind
      the first free socket itself -- kernel-mediated, no userspace race -- then
      writes the number back down an inherited pipe.
    expect:
      module: camoufox.virtdisplay
      xvfb_args_contain: "-displayfd"

  - id: displayfd-read-timeout
    title: The displayfd read is bounded
    check: automated
    evidence:
      - "commit 8f9ff07: 'so a hung Xvfb fails fast instead of blocking forever'"
    rationale: >-
      A hung Xvfb with no timeout blocks the launch forever, at 0% CPU, with no
      diagnostic. Ten seconds is the agreed bound.
    expect:
      module: camoufox.virtdisplay
      attribute: DISPLAYFD_READ_TIMEOUT_S
      is_positive_number: true

  - id: xvfb-cleanup-runs-even-if-it-already-died
    title: The display's lock and socket are removed whether or not we killed it
    check: automated
    evidence:
      - "found by browser/tests/native/test_crash_recovery.py::test_xvfb_sigkill_under_a_virtual_display"
      - "isolated: Xvfb alive -> socket removed; Xvfb already dead -> socket leaked"
    rationale: >-
      kill() used to gate its entire body on `self.proc.poll() is None`, so a
      display whose Xvfb had already died -- crashed, OOM-killed, reaped with
      the browser's process group -- was never cleaned up. That is backwards: a
      SIGKILLed Xvfb never removes its own socket, so the crash path is the only
      one where /tmp/.X11-unix/X<n> survives, and it was the one path kill()
      skipped. Stranded sockets accumulate, and -displayfd scans upward for a
      free number, so each one pushes the next display higher until a
      long-running host stops being able to allocate one at all.

  - id: xvfb-sigkill-and-socket-cleanup
    title: Xvfb is SIGKILLed, reaped, and its X11 lock and socket removed
    check: automated
    evidence:
      - "PR #652 / commit 71fe028"
      - "PR #618 / commit ce5edf6: wait() the child or it becomes a zombie"
    rationale: >-
      The old terminate-wait-kill ladder left zombie Xvfb processes, and the
      stale /tmp/.X{n}-lock and /tmp/.X11-unix/X{n} files it left behind blocked
      later display allocation. Both halves matter: SIGKILL then wait() so
      nothing is reaped later, then unlink both files.

  # -------------------------------------------------------------------------
  # Dependencies
  # -------------------------------------------------------------------------

  - id: no-third-party-camoufox-distribution
    title: Nothing here depends on someone else's camoufox package
    check: automated
    evidence:
      - "PR #521 (2026-03-15) added `cloverlabs-camoufox` to build-tester/requirements.txt"
      - "the commit's author is the PyPI author of that package"
      - "browser/tests/build-tester/scripts/presets.py already prints the correct answer in its ImportError handler"
    rationale: >-
      build-tester generates its fingerprints with camoufox.fingerprints, so
      whichever distribution provides `camoufox` decides what is actually being
      tested. Pointing that at a third-party redistribution means the binary is
      graded against someone else's fingerprint generation, a divergence between
      the two reads as a browser bug, and every CI run pulls an outside package
      into a job holding repository credentials. The only `camoufox` this
      repository may install is python/ from this tree.
    expect:
      no_dependency_matching: "camoufox"
      except_paths: ["python/pyproject.toml"]
      allowed_forms: ["-e ../../../python", "-e ./python", "-e python"]

  # -------------------------------------------------------------------------
  # Measurement
  # -------------------------------------------------------------------------

  - id: animations-run-on-stock-timing
    title: Animations run on stock timing unless the caller opts into instantAnimations
    check: automated
    evidence:
      - "measured on v152.0.4-beta.31: el.animate(frames, 1000).effect.getComputedTiming().duration returned 0, a 500ms transition 0"
      - "the finished promise still resolved after ~1000ms, so the only saving was Playwright's stability wait"
    rationale: >-
      Instant animations were the default so Playwright never waited on one,
      but any page reads the zero duration back in one line. Reporting the
      real duration while not rendering the animation does not hide it
      either: getComputedStyle or getBoundingClientRect sampled mid-animation
      returns the end state. So the saving costs stealth, and it is the
      caller's choice: `instantAnimations: True` turns it on and warns.

  - id: spoofed-voices-speak
    title: speak() on a spoofed voice starts, then ends after the text's duration
    check: automated
    evidence:
      - "measured on v152.0.4-beta.31: speak() on a spoofed voice fired `error` after 3ms"
      - "voices:fakeCompletion, the opt-out, fired start and end in the same tick"
    rationale: >-
      A spoofed voice has no engine behind it, and a real voice never errors
      on a plain utterance or ends the instant it starts. So the browser
      speaks it silently for as long as the text takes at ~150 words per
      minute. The two config keys that chose between the two tells are gone.

  - id: no-glyph-spacing-noise
    title: Text is shaped exactly as stock Firefox shapes it; there is no spacing seed
    check: automated
    evidence:
      - "#779 (6daae88): measured +1 px per ~100 glyphs and fractional deltas on every measureText; defaulted the seed to 0"
      - "issue #741 / ad697a8: the perturbation detached combining marks in Thai, Lao, Arabic, Devanagari and Hebrew"
    rationale: >-
      The feature added a seeded amount to every glyph advance so that text
      widths differed per context. No real machine produces those widths:
      the same font on the same OS measures the same everywhere, so a width
      that matches no real installation is a fingerprint, not a disguise. It
      was defaulted off in #779 and kept as an opt-in, but an opt-in whose
      only effect is to become detectable is not a feature, so the manager,
      the window setter, the shaper hook and the config key are gone.

  - id: canvas-is-not-noised
    title: The canvas is rendered, not noised, and there is no canvas seed
    check: automated
    evidence:
      - "PR #528 (e4528a2): 'Disable Canvas Noise' -- removed the canvas noise patch"
      - "issue #721: canvas:seed declared and passed through, but nothing consumed it"
      - "24 profiles across 3 runs on v152.0.4-beta.30: canvas 16 distinct of 24, audio 24 of 24"
      - "toolkit/components/resistfingerprinting/RFPTargetsDefaultBaseline.inc: EfficientCanvasRandomization is on by default in every window"
      - "v156.0.1-beta.32: two contexts, identical getImageData, PNG data URLs differing only by a deBG chunk"
    rationale: >-
      Stock Firefox does not perturb canvas pixels, so noise is itself a tell:
      a page that renders the same image twice and gets two answers has found
      a spoofing browser. What stock Firefox does do, through baseline
      fingerprinting protection, is append a per-session deBG chunk to PNGs
      from toDataURL and toBlob; Camoufox leaves that on, as Firefox ships it. A context's canvas therefore follows what really
      determines it on a real machine, the GPU and the fonts, and two contexts
      that share those share a canvas. That is why build-tester counts canvas
      collisions with the device-level values and does not gate on them. The
      launchers generated a canvas:seed for three releases after the patch
      that read it was gone; it is not generated or declared any more. The one
      exception is an identity on another OS or GPU than the host's, whose
      canvas cannot agree with it (cross-os-canvas-is-the-rfp-placeholder).

  - id: cross-os-canvas-is-the-rfp-placeholder
    title: On the host's OS the identity claims the host's GPU; on another OS or GPU canvas readback is RFP's random placeholder
    check: automated
    evidence:
      - "v156.0.1-beta.32, 2026-10-06: getImageData and readPixels identical with privacy.fingerprintingProtection on and off; CanvasUtils.cpp checks EfficientCanvasRandomization (PNG deBG chunk only) before CanvasRandomization"
      - "LibreWolf librewolf.cfg: privacy.resistFingerprinting true, no canvas prefs of its own; RFP readback without permission is TryToGenerateRandomDataForPlaceholderCanvasData"
      - "v156.0.1-beta.32: the three RFP canvas targets in privacy.baselineFingerprintingProtection.overrides give RFP's readback (random, toDataURL ~770 bytes) with hardwareConcurrency untouched"
      - "v156.0.1-beta.32: a Linux host with an RTX 5080 and a Ryzen iGPU reported 'AMD, Radeon HD 3200 Graphics, or similar' to WebGL, headless and headed"
      - "v156.0.1-beta.32: a Linux identity whose config claimed availHeight 1053 on a 1080 screen read 1080 (nsRFPService::GetSpoofedScreenAvailSize, no Linux offset)"
    rationale: >-
      Canvas and WebGL pixels come from the host's OS, driver and GPU. On the
      host's OS the identity claims the GPU Firefox reports there, read from the
      browser itself because Firefox may render on another device than system
      tools name and sanitizes the name its own way; a software renderer
      matches any GPU, as a machine whose driver failed to load. On another OS,
      or with another GPU (one the caller or a preset names, or a host GPU
      fpgen never recorded, which has no WebGL data to claim), nothing can
      agree, and Firefox 156's private windows do not hide pixels, so the
      launchers turn on privacy.resistFingerprinting's canvas targets through
      the baseline overrides and nothing else. One function in each launcher
      (plan_rendering, planRendering) makes that decision for the launch and
      for the host identity its contexts must keep; a covered browser binds
      no context to the host. The readback is then
      what LibreWolf, Tor Browser and Mullvad Browser return; stock Firefox
      does not, so the launch warns. Firefox's older keyed pixel noise
      (CanvasRandomization) was rejected: no current Firefox produces it by
      default. Spoofed avail-screen and touch values go through baseline
      protection like the real ones, for the claimed OS, so the launchers
      claim them as it reports them (follow_baseline_protection,
      followBaselineProtection): the available screen is the screen less 48px
      on Windows, 76px on macOS and nothing on Linux, and more than one touch
      point is 5. A config claiming fpgen's recorded values read differently
      on the page.

  - id: webgpu-follows-the-claimed-device
    title: navigator.gpu where Firefox on the claimed device has it; the host's adapter only behind the host's own GPU
    check: automated
    evidence:
      - "StaticPrefList.yaml (156.0.1): dom.webgpu.enabled is true on XP_WIN and on aarch64 XP_MACOSX, early-beta only elsewhere"
      - "fpgen gpuInfo, Firefox: navigator.gpu with no adapter on Windows on the Microsoft Basic Render Driver; no navigator.gpu on Intel and AMD Macs; no navigator.gpu for 97% of Linux"
      - "dom/webgpu/Adapter.h: GPUAdapterInfo vendor, architecture, device and description are always empty; limits and features are the real adapter's"
      - "v156.0.1-beta.32, Linux, prefs at startup: gfx.blacklist.webgpu 1 gives a real adapter, 4 (FEATURE_BLOCKED_DEVICE) resolves requestAdapter() to null"
      - "the same prefs through Playwright's firefox_user_prefs alone arrive after gfxPlatform::InitWebGPUConfig and are ignored"
    rationale: >-
      WebGPU hands the page the host's adapter: its limits and features name
      the real GPU even though Firefox blanks the adapter strings. Exposure
      follows Firefox's own build rule for the claimed device, so a Linux or
      Intel Mac identity has no navigator.gpu and a Windows or Apple Silicon one
      does. The adapter is the host's only when the identity claims the host's
      hardware GPU; otherwise the launchers set the downloadable blocklist's
      pref to a blocked device, and requestAdapter() resolves to null as it
      does for real users on a blocked or software GPU. The pref is read once at
      startup, so it goes through CAMOU_PREFS. It is written either way,
      because a persistent profile saves it and the next startup reads it.

  - id: webgl-browser-owned-values-follow-firefox
    title: WebGL values the browser decides follow the running Firefox and the claimed OS's backend, not fpgen's recording
    check: automated
    evidence:
      - "fpgen model-2/2026 records Firefox 146 (90% of Windows, 89% of macOS, 66% of Linux user agents); Camoufox ships 156.0.1"
      - "stock 146.0 and 156.0.1 on the same machines, twice each: Windows 11 on Intel Iris Xe and RTX 3050 Ti (headed), M1 Pro (headed), Linux on a Ryzen iGPU (headless); fpgen's records match 146 on the same hardware"
      - "Windows: 156 exposes EXT_depth_clamp in WebGL1 and WebGL2 on both GPUs, 146 on neither, and no fpgen Windows record has it. third_party/angle/src/libANGLE/renderer/d3d/d3d11/renderer11_utils.cpp:1334 (156, ANGLE chromium/7778) sets depthClampEXT = true on every D3D11 feature level; 146's ANGLE (chromium/5359) never sets it"
      - "Linux: WebGL1 ALIASED_LINE_WIDTH_RANGE is [1, 2048] on 146 and [1, 1] on 156, WebGL2 [1, 1] on both. 146's dom/canvas/WebGLContext.cpp:324 forced REQUIRE_COMPAT_PROFILE on WebGL1 unless webgl.1.allow-core-profiles, which 146's StaticPrefList.yaml set on macOS only; 156 removed both, and WebGLContextValidate.cpp:211 reads the driver's range only off a core profile, leaving WebGLTypes.h:654's {1, 1}"
      - "fpgen Linux WebGL2 records: [1, 1] on 97%, the driver's range on the 3% without EXT_depth_clamp (GLES drivers, where Firefox reads it)"
      - "browser/tests/playwright/patches/stock-gpu-parity.py fails on the 146-style WebGL1 range on Linux, on a hardware GPU and on llvmpipe, and passes with the fix"
    rationale: >-
      fpgen's records are right for the Firefox that made them; what goes
      stale is what that Firefox decided rather than the GPU. Hardware-owned
      values (the renderer, most limits, the extensions a Linux or macOS
      driver offers) keep coming from the recording. Browser-owned ones are
      corrected where the launchers convert a recording (to_config). ANGLE's
      D3D11 backend gives every Windows GPU EXT_depth_clamp, which takes its
      place in Firefox's alphabetical extension order. WebGL1 now shares
      WebGL2's GL profile, so it reports the line width range the same device
      recorded for WebGL2, which is right for core profiles and GLES drivers
      alike. Live state that also changed (the stencil masks) is answered by
      the real context and needs nothing. stock-gpu-parity finds the next
      drift: it fails where stock Firefox of the recorded release and of the
      shipped one differ on the same machine and Camoufox does not follow the
      shipped one.

  - id: canvas-fingerprint-is-hashed-not-truncated
    title: The canvas check hashes pixels, not a prefix of the data URL
    check: automated
    evidence:
      - "browser/tests/build-tester/src/lib/checks/collectors.ts returned canvas.toDataURL().substring(0, 100)"
      - "CI reported two contexts sharing a canvas fingerprint; 8 local runs across two rendering paths never did"
    rationale: >-
      A hundred characters of a data URL is not the image. "data:image/png;base64,"
      takes 22 of them, leaving about 58 bytes of PNG: the signature, the IHDR
      giving width and height, the IDAT header, and roughly fifteen bytes of
      deflate stream. Cross-profile uniqueness was therefore decided by whether
      the noise happened to land in the top-left of the first scanline, and two
      contexts whose canvas differed everywhere else read as identical. Worse,
      the stability check compared the same prefix between two collections, so
      it passed on PNG headers and could not have noticed non-deterministic
      output. getImageData is the surface a fingerprinter reads; hash that.

  # -------------------------------------------------------------------------
  # Teardown
  # -------------------------------------------------------------------------

  - id: launch-failure-tears-down-playwright
    title: A failed launch must not leak the Playwright session
    check: automated
    evidence:
      - "issue #82 / PR #655 / commit 0d54401"
    rationale: >-
      The Playwright session is started before the browser. If the launch then
      raises -- bad proxy, missing binary, invalid options -- the driver process
      and its connection stay alive with nothing holding them. Every launch path
      wraps the launch and calls the base __aexit__ on failure.

  - id: close-failure-still-tears-down
    title: browser.close() raising must not skip teardown
    check: automated
    evidence:
      - "issue #82 / PR #655 / commit 0d54401"
      - "commit fd1bb2f: the same rule for the virtual display"
    rationale: >-
      A browser that has already crashed makes close() raise, and the original
      code let that exception skip the driver teardown -- so the failure mode
      that leaks is exactly the one that happens under load. The close goes in a
      try, the teardown in the finally. The virtual display is cleaned up the
      same way.

  # -------------------------------------------------------------------------
  # Contexts and windows
  # -------------------------------------------------------------------------

  - id: no-viewport-when-window-is-spoofed
    title: Spoofed window dimensions imply no_viewport
    check: automated
    evidence:
      - "issue #666 / PR #673: page-recycle hang under spoofed window dims"
    rationale: >-
      Playwright's default viewport deadlocks Juggler when the window has been
      spoofed to a different size. Both launch paths default to no_viewport when
      spoofs_window_dimensions() is true, unless the caller said otherwise.
    expect:
      module: camoufox.utils
      has_callables: [spoofs_window_dimensions, attach_no_viewport_default]

  - id: virtual-display-skips-screen-clamp
    title: A virtual display never clamps the generated screen
    check: automated
    evidence:
      - "python/src/camoufox/utils.py: the `not virtual_display` guards"
    rationale: >-
      This is what makes the 1x1 default safe. If clamping applied, a 1x1 root
      window would clamp every generated screen down to 1x1 and the fingerprint
      would be absurd. The guard and the 1x1 default stand or fall together --
      remove the guard and the display size stops being a free choice.

  - id: evaluate-is-isolated-by-default
    title: page.evaluate runs in an isolated world; "mw:" is the opt-in hatch
    check: automated
    evidence:
      - "PR #745 / issue #738: let init scripts reach the page world with 'mw:'"
      - "commit c3d5721: evaluate in an isolated world, with an opt-in main-world hatch"
    rationale: >-
      Injected automation JavaScript running in the page's world is visible to
      the page, which is the thing this fork exists to prevent. Isolation is the
      default and the "mw:" prefix is the deliberate, per-call way out. Upstream
      Playwright's suite is run with isolation off because it asserts upstream
      semantics -- that flag must never become the default here.

  # -------------------------------------------------------------------------
  # Juggler frame lifecycle
  # -------------------------------------------------------------------------

  - id: per-frame-state-released-on-dispose
    title: Anything reset when the document changes is also released when the frame dies
    check: automated
    evidence:
      - "browser/additions/juggler/content/FrameTree.js: _masterSandbox was cleared in _onGlobalObjectCleared() but not in Frame.dispose()"
      - "upstream Playwright's FrameTree.js has no _masterSandbox, and dispose() was inherited from it verbatim"
    rationale: >-
      Frame.dispose() came from upstream, which has no Camoufox-specific
      per-frame fields. So when one is added, only the navigation path tends to
      learn about it, and a frame that is *destroyed* rather than navigated
      keeps it -- which is the common case on any page that creates and removes
      iframes. _masterSandbox made that concrete: built over the page window
      with a system principal, it holds the window's global and with it the
      whole document, so a retained one keeps a dead document alive. The
      invariant is simply that the two teardown paths agree: a field worth
      resetting when the document changes is worth releasing when the frame goes
      away, and a sandbox needs nuking rather than just dropping.

  - id: fingerprint-setters-sealed-per-window
    title: The window.setXxx() fingerprint setters start sealed, and the seal is per window
    check: manual   # browser/tests/playwright/patches/fingerprint-setter-seal.py
    evidence:
      - "PR #749 (7911f4a): setters a fingerprint never called stayed on window, and a launch with no init script leaked all of them"
      - "browser/patches/window-setter-seal.patch"
    rationale: >-
      The setters are configuration API for the automation side, not page API.
      A window starts sealed; juggler unseals it, runs the init scripts that
      apply a per-context fingerprint, and seals it again before page script
      runs. Sealed is the default so the failure is closed: a window automation
      never drives (the binary launched as a plain browser) never offers them,
      instead of offering them permanently to whatever loads. The flag is per
      window, not per browsing context: every new document needs its own
      configuration window, and a context-wide flag would seal on the first
      about:blank and leave every later navigation unable to apply a
      fingerprint. The Func= guards consult the flag, which is what stops the
      DOM resolve hook handing a name back after it has been deleted.

  # -------------------------------------------------------------------------
  # Input
  # -------------------------------------------------------------------------

  - id: input-through-one-chokepoint
    title: Every synthesized input event goes through MouseDispatch.js
    check: manual   # enforced by browser/scripts/check-input-dispatch.py in CI
    evidence:
      - "docs/input-dispatch.md: four deadlocks between 2026-04 and 2026-09"
      - "issues #225, #677, #751, #752"
    rationale: >-
      Four separate deadlocks, each fixed by adding one more coordinate guard at
      one more call site, which does not converge -- the trigger set is not
      enumerable, because whether a coordinate reaches the renderer depends on a
      rounding accident in the fractional height of spoofed browser chrome. One
      unbounded await for an ack that never arrives wedges input for every tab
      in the process, permanently, at 0% CPU.

  # -------------------------------------------------------------------------
  # Config schema
  # -------------------------------------------------------------------------

  - id: config-keys-are-never-deleted
    title: A key leaves browser/settings/properties.json only by being marked removed
    check: automated
    evidence:
      - "issue #835: camoufox 0.4.11 failed to launch v156.0.1-beta.34 with 'Unknown property navigator.appCodeName in config'"
      - "#787 (180e655) deleted 35 keys the browser no longer read; every release from v156.0.1-beta.32 shipped without them"
    rationale: >-
      properties.json ships inside the browser, and every released library
      validates its config against the copy in whatever browser it finds.
      Libraries up to 0.4.x raise on a key they send that the browser does not
      declare, and they accept every browser release below 1, so they download
      new releases on their own. Deleting a key therefore breaks launches for
      everyone on an older library the moment a release ships. A key the
      browser stops reading is instead kept with a "removed" field: older
      libraries still validate it, the browser ignores it, and current
      libraries skip it with a warning that it has no effect.

  # -------------------------------------------------------------------------
  # Network
  # -------------------------------------------------------------------------

  - id: https-first-stays-on
    title: HTTPS-First keeps Firefox's default, on
    check: manual
    evidence:
      - "#638 (restored in 0e4151f) set dom.security.https_first=false in camoufox.cfg so Playwright's GET-only test proxy passed"
      - "914b575 removed it again; ci/skiplist.yml lists the proxy tests it fails, with the reason"
      - "measured 2026-10-08 on a v156.0.1-beta.32 build: every proxy test in test_proxy.py and test_browsercontext_proxy.py passes with the pref appended to camoufox.cfg, and fails without it"
    rationale: >-
      Stock Firefox tries an http:// navigation as https:// first, and a server
      sees whether a browser does, so turning it off marks the browser as not
      stock Firefox. Playwright's own Firefox turns it off (playwright.cfg), and
      upstream's proxy tests depend on that: their proxy is the test server,
      which answers plain GETs and cannot open the CONNECT tunnel the upgrade
      needs. A real proxy handles CONNECT, as every https:// site needs it to.
      Those tests are skiplisted rather than passed by changing the browser.
