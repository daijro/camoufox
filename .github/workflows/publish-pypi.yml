name: Publish to pypi

# The Python package, in two channels, each paired with one browser release.
#
#   prerelease  after "Build and Release" finishes for a tested merge to main:
#               <next>bN on PyPI (pip ignores it without --pre), then npm
#               <next>-beta.N under the `next` dist-tag (publish-npm.yml).
#   stable      a `vX.Y.Z` tag pushed on a main commit whose tests passed: the
#               browser release built from that commit's sources becomes the
#               stable, latest release, then X.Y.Z goes to PyPI and npm `latest`.
#
# Every package is stamped with the browser release built from the same sources
# (ci/release.py stamp -> pythonlib/camoufox/browser-pin.json), and both
# launchers fetch and launch exactly that build by default.
#
# npm always follows this workflow (publish-npm.yml runs on its completion),
# because npm's trusted publishing is bound to that workflow file.

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
  push:
    tags: ["v*"]

permissions: {}

# One group per channel: GitHub keeps a single pending run per group, and a
# merge landing while a promotion waits must not cancel the promotion.
concurrency:
  group: library-release-${{ github.event_name == 'push' && 'stable' || 'prerelease' }}
  cancel-in-progress: false

jobs:
  plan:
    # Browser release tags (v156.0.1-beta.33) are pushed by the workflow token
    # and never start a run; the pattern check in check-promotable is what keeps
    # anything but vX.Y.Z from promoting.
    if: >-
      github.event_name == 'push' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read # the tested-commit artifact of the "Build and Release" run
    outputs:
      go: ${{ steps.commit.outputs.go }}
      channel: ${{ steps.commit.outputs.channel }}
      sha: ${{ steps.commit.outputs.sha }}
      browser_tag: ${{ steps.paired.outputs.browser_tag }}
      py_version: ${{ steps.plan.outputs.py_version }}
      npm_version: ${{ steps.plan.outputs.npm_version }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - name: The commit "Build and Release" tested
        if: github.event_name == 'workflow_run'
        # Absent when that run built nothing because its tests had failed.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tested-commit
          path: ${{ runner.temp }}/tested
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: commit
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [ -s "$RUNNER_TEMP/tested/tested-commit" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "sha=$(cat "$RUNNER_TEMP/tested/tested-commit")" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::'Build and Release' recorded no tested commit; nothing to publish."
          fi
      - uses: actions/checkout@v6
        if: steps.commit.outputs.go == 'true'
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
      - name: Only a tested main commit is promoted
        if: steps.commit.outputs.channel == 'stable'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci.release check-promotable --tag "$GITHUB_REF_NAME"
      - name: Only a tested commit is prereleased
        if: steps.commit.outputs.channel == 'prerelease'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci.release check-tested
      - id: paired
        name: The browser release built from these sources
        if: steps.commit.outputs.go == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci.release paired
      - id: plan
        if: steps.commit.outputs.go == 'true'
        run: |
          python3 -m ci.release lib-plan --channel "${{ steps.commit.outputs.channel }}" \
            ${{ github.event_name == 'push' && format('--tag {0}', github.ref_name) || '' }}

  npm-preflight:
    # The npm package must build and pack at this commit before anything is
    # published, so PyPI never gets a release npm then cannot follow.
    needs: plan
    if: needs.plan.outputs.go == 'true'
    permissions:
      contents: read
      actions: read # publish-npm.yml's release job declares it
      id-token: write # publish-npm.yml's job declares it; a dry run does not use it
    uses: ./.github/workflows/publish-npm.yml
    with:
      dry_run: true
      ref: ${{ needs.plan.outputs.sha }}

  promote-browser:
    needs: [plan, npm-preflight]
    if: needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release flags
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci.release promote

  publish:
    needs: [plan, npm-preflight, promote-browser]
    # promote-browser is skipped for a prerelease; it must not have failed.
    if: >-
      always() && needs.plan.outputs.go == 'true' &&
      needs.npm-preflight.result == 'success' && needs.promote-browser.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pythonlib
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install publishing tools
        run: pip install vermin build twine

      - name: Check Python compatibility
        # The package must run on the floor pyproject.toml declares (python =
        # "^3.10"); `3.10-` means "needs at most 3.10". typing_extensions is a
        # dependency, not a stdlib module for vermin to date.
        run: vermin . --eval-annotations --backport typing_extensions --target=3.10- --violations camoufox/ || exit 1

      - name: Stamp the version and the paired browser
        working-directory: .
        run: |
          python3 -m ci.release stamp \
            --browser-tag "${{ needs.plan.outputs.browser_tag }}" \
            --py-version "${{ needs.plan.outputs.py_version }}" \
            --npm-version "${{ needs.plan.outputs.npm_version }}"
          cat pythonlib/camoufox/browser-pin.json

      - name: Build package
        run: python -m build

      - name: The package carries its browser pin
        run: |
          python - <<'EOF'
          import glob, json, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          pin = json.loads(zipfile.ZipFile(wheel).read("camoufox/browser-pin.json"))
          assert pin["tag"] == "${{ needs.plan.outputs.browser_tag }}", pin
          print(f"{wheel} pins {pin['tag']}")
          EOF

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_NON_INTERACTIVE: "1"
        run: twine upload dist/*

      - name: Hand the release to publish-npm.yml
        working-directory: .
        run: |
          cat > release.json <<EOF
          {
            "sha": "${{ needs.plan.outputs.sha }}",
            "browser_tag": "${{ needs.plan.outputs.browser_tag }}",
            "py_version": "${{ needs.plan.outputs.py_version }}",
            "npm_version": "${{ needs.plan.outputs.npm_version }}",
            "dist_tag": "${{ needs.plan.outputs.dist_tag }}"
          }
          EOF
          cat release.json

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.json
