name: Build and Release

# A browser prerelease for every tested merge to main that changes the browser.
#
# Runs after the Tests workflow passes on a push to main. `plan` hashes the
# browser's sources (ci.browser_inputs.source_digest): if a release was already
# built from exactly these sources, nothing is built and the library release
# that follows (publish-pypi.yml) pairs with that one. Otherwise `plan` takes the
# next unused release number, commits it beside main as the release commit
# (main is protected; the tag points at the tested commit plus that one line),
# and the matrix builds from the tag. The result is a GitHub *prerelease*, never
# a draft: users only get it by opting in (`camoufox set official/prerelease`)
# or through a prerelease library pinned to it. Promotion to stable is a tag on
# the tested main commit -- see publish-pypi.yml and ci/release.py.
#
# workflow_dispatch builds the head of main the same way.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # The version tests.yml builds and tests with, so a release is compiled by the
  # same interpreter every pull request's build job already exercised.
  PYTHON_VERSION: "3.12"

# Release numbers are allocated here; two plans must never race for one.
concurrency:
  group: browser-release
  cancel-in-progress: false

jobs:
  plan:
    # A push to main in this repository whose tests passed. `branches: [main]`
    # alone would also match a pull request from someone's fork named main.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release commit's tag
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      digest: ${{ steps.plan.outputs.digest }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m ci.release browser-plan
      - name: Cut the release commit
        if: steps.plan.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m ci.release cut --tag "${{ steps.plan.outputs.tag }}"
      - name: Record the tested commit for publish-pypi.yml
        # A workflow started by this one's completion is told main's head, not
        # the commit tested here; two quick merges would otherwise publish the
        # second, untested one.
        run: echo "${{ steps.sha.outputs.sha }}" > tested-commit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-commit
          path: tested-commit

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # `make dir` (inside ci.run_prepare) writes the mozconfig and adds the Rust
      # targets from BUILD_TARGET, defaulting to macos,arm64 when it is unset.
      # multibuild.py sets the same value again before building.
      BUILD_TARGET: ${{ matrix.target }},${{ matrix.arch }}
    strategy:
      matrix:
        target: [linux, windows, macos]
        arch: [x86_64, arm64, i686]
        exclude:
          # Fails (.mozbuild does not include clang++-cl)
          - target: windows
            arch: arm64
          # Unsupported
          - target: macos
            arch: i686
          - target: linux
            arch: i686

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          # ccache: the mozconfig enables --with-ccache, but the runner image no
          # longer ships it, so configure fails with "Cannot find ccache".
          # fontconfig: scripts/verify-fonts.py resolves every reportable family
          # through fc-list/fc-match, so the bundle is checked with the same tool
          # the browser uses rather than assumed correct.
          sudo apt-get install -y msitools p7zip-full aria2 ccache fontconfig

      - name: Fetch the font bundle
        # The bundle is a release asset, not repo content (~2.16 GB extracted,
        # 843 MB as .tar.xz -- see scripts/fetch-fonts.py). Without this the
        # package would ship with NO fonts while pythonlib/camoufox/fonts.json
        # still reports hundreds of families, which is a reverse leak in the
        # shipped browser. After the dependency install, so the download uses
        # aria2c's parallel connections rather than the curl fallback.
        run: make fonts-extract

      - name: Verify the font bundle matches the manifest
        # Full run, not --quick: this is the release path, and the one invariant
        # that cannot be recovered after publishing is a family fonts.json
        # reports that the packaged fontconfig cannot resolve.
        run: python3 scripts/verify-fonts.py

      - name: Prepare the source tree
        # setup-minimal (which fetches the tarball) -> dir -> mozbootstrap, with
        # the two network-bound steps retried on transient failures, exactly as
        # the tests.yml build job does. multibuild.py then finds _READY and
        # builds without re-patching.
        run: python3 -m ci.run_prepare

      - name: Create swap space
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Build
        env:
          # Cap Rust parallelism to lower peak memory (avoids OOM/SIGTERM).
          # Tune to taste: higher = faster but more RAM.
          CARGO_BUILD_JOBS: "1"
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [plan, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Publish the prerelease
        # Not a draft: the library prerelease that follows pairs with it, and
        # finds it by the markers in its notes (ci.release paired).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 -m ci.release notes \
            --digest "${{ needs.plan.outputs.digest }}" --commit "${{ needs.plan.outputs.sha }}" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --latest=false --title "$TAG" \
            --notes-file notes.md --generate-notes \
            $(find artifacts -type f)
