name: Publish to npm

# The npm half of a launcher release. The two packages ship together, at one
# version spelled for each registry (0.5.8b2 on PyPI is 0.5.8-beta.2 here;
# scripts/check-pack.mjs refuses anything else), each stamped with the same
# paired browser. "Publish to pypi" is the one place a release starts:
#
#   1. publish-pypi.yml calls this workflow as a dry run -- every check, the
#      build, the pack check and `npm publish --dry-run` -- so a broken npm
#      package stops the release before anything is uploaded anywhere;
#   2. it stamps and uploads to PyPI, and leaves the release it made as the
#      `release` artifact (commit, versions, paired browser, dist-tag);
#   3. its success triggers this workflow again (workflow_run), which stamps the
#      same commit the same way and publishes it: a prerelease under the `next`
#      dist-tag, a stable release under `latest`.
#
# Started by hand with a "Publish to pypi" run id, this workflow only retries
# step 3 -- after an npm outage, say -- and refuses unless PyPI already has the
# version, so npm can never get a release PyPI does not.
#
# Authentication is npm trusted publishing (OIDC): no token is stored anywhere.
# npm accepts this workflow's identity because the package's settings on
# npmjs.com name this repository and this file (publish-npm.yml). Renaming the
# file, or publishing from a fork, is rejected by the registry. The first
# version of a new package has to be published by hand, since the trusted
# publisher is configured on a package that already exists.

on:
  workflow_run:
    workflows: ["Publish to pypi"]
    types: [completed]
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
      ref:
        description: "Commit to check"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      pypi_run:
        description: "Id of the 'Publish to pypi' run whose release to publish"
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    # After a PyPI run, only a successful one; and only if it released something.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read # the release artifact of the "Publish to pypi" run
    outputs:
      go: ${{ steps.release.outputs.go }}
      sha: ${{ steps.release.outputs.sha }}
      browser_tag: ${{ steps.release.outputs.browser_tag }}
      py_version: ${{ steps.release.outputs.py_version }}
      npm_version: ${{ steps.release.outputs.npm_version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: The release PyPI made
        if: ${{ !inputs.dry_run }}
        # Absent when that run published nothing (no tested commit to release).
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          run-id: ${{ github.event.workflow_run.id || inputs.pypi_run }}
          github-token: ${{ github.token }}

      - id: release
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "sha=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          f="$RUNNER_TEMP/release/release.json"
          if [ ! -s "$f" ]; then
            echo "::notice::'Publish to pypi' released nothing; nothing to publish."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          cat "$f"
          for key in sha browser_tag py_version npm_version dist_tag; do
            echo "$key=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]])" "$f" "$key")" >> "$GITHUB_OUTPUT"
          done

  publish:
    needs: release
    if: needs.release.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing, and the provenance attestation
    defaults:
      run:
        working-directory: typescript
    env:
      CAMOUFOX_FPGEN_DATA: ${{ github.workspace }}/.fpgen
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The commit PyPI was released from, not whatever main is now.
          ref: ${{ needs.release.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pythonlib
        # tests/golden-setup.ts records the golden fixtures from it, and the
        # build copies its data files into the package.
        working-directory: .
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ci/requirements.txt -e pythonlib
          .venv/bin/python scripts/pin-fpgen-model.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and lint
        run: |
          pnpm typecheck
          pnpm check

      - name: Test
        # Before stamping: the suite checks the source tree, whose versions are
        # spelled identically in both packages.
        run: pnpm test

      - name: Stamp the version and the paired browser
        if: ${{ !inputs.dry_run }}
        working-directory: .
        run: |
          python3 -m ci.release stamp \
            --browser-tag "${{ needs.release.outputs.browser_tag }}" \
            --py-version "${{ needs.release.outputs.py_version }}" \
            --npm-version "${{ needs.release.outputs.npm_version }}"

      - name: Build package
        run: pnpm build

      - name: Check package
        run: node scripts/check-pack.mjs

      - name: The package carries its browser pin
        if: ${{ !inputs.dry_run }}
        run: |
          tag=$(node -p "require('./dist/data-files/browser-pin.json').tag")
          test "$tag" = "${{ needs.release.outputs.browser_tag }}" || {
            echo "::error::dist pins '$tag', expected ${{ needs.release.outputs.browser_tag }}"; exit 1; }
          echo "package pins $tag"

      - name: PyPI has this version
        # npm never gets a release PyPI does not have. Retried for a few minutes:
        # straight after the upload, PyPI's JSON API can lag.
        if: ${{ !inputs.dry_run }}
        run: |
          version="${{ needs.release.outputs.py_version }}"
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/camoufox/$version/json"; then
              echo "camoufox $version is on PyPI"
              exit 0
            fi
            sleep 15
          done
          echo "::error::camoufox $version is not on PyPI. Release through 'Publish to pypi', which publishes to npm after it."
          exit 1

      - name: Publish to npm
        # A dry run uploads nothing, so it has nothing to attest.
        run: |
          if [ "$DRY_RUN" = true ]; then
            npm publish --access public --dry-run --provenance=false --tag next
          else
            npm publish --access public --tag "${{ needs.release.outputs.dist_tag }}"
          fi
