name: Publish to npm

# The npm half of a launcher release. The two packages ship together, at one
# version (scripts/check-pack.mjs refuses a package.json that differs from
# pythonlib's), and "Publish to pypi" is the one place a release starts:
#
#   1. publish-pypi.yml calls this workflow as a dry run -- every check, the
#      build, the pack check and `npm publish --dry-run` -- so a broken npm
#      package stops the release before anything is uploaded anywhere;
#   2. it uploads to PyPI;
#   3. its success triggers this workflow again (workflow_run), which publishes
#      the same commit to npm.
#
# Started by hand, this workflow only retries step 3 -- after an npm outage,
# say -- and refuses unless PyPI already has this version, so npm can never get
# a release PyPI does not.
#
# Authentication is npm trusted publishing (OIDC): no token is stored anywhere.
# npm accepts this workflow's identity because the package's settings on
# npmjs.com name this repository and this file (publish-npm.yml). Renaming the
# file, or publishing from a fork, is rejected by the registry. The first
# version of a new package has to be published by hand, since the trusted
# publisher is configured on a package that already exists.

on:
  workflow_run:
    workflows: ["Publish to pypi"]
    types: [completed]
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and `npm publish --dry-run`, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    # After a PyPI run, only a successful one.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing, and the provenance attestation
    defaults:
      run:
        working-directory: typescript
    env:
      CAMOUFOX_FPGEN_DATA: ${{ github.workspace }}/.fpgen

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The commit PyPI was released from, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install pythonlib
        # tests/golden-setup.ts records the golden fixtures from it, and the
        # build copies its data files into the package.
        working-directory: .
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r ci/requirements.txt -e pythonlib
          .venv/bin/python scripts/pin-fpgen-model.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 24 ships.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and lint
        run: |
          pnpm typecheck
          pnpm check

      - name: Test
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Check package
        run: node scripts/check-pack.mjs

      - name: PyPI has this version
        # npm never gets a release PyPI does not have. Retried for a few minutes:
        # straight after the upload, PyPI's JSON API can lag.
        if: ${{ !inputs.dry_run }}
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/camoufox/$version/json"; then
              echo "camoufox $version is on PyPI"
              exit 0
            fi
            sleep 15
          done
          echo "::error::camoufox $version is not on PyPI. Release through 'Publish to pypi', which publishes to npm after it."
          exit 1

      - name: Publish to npm
        # A dry run uploads nothing, so it has nothing to attest.
        run: npm publish --access public ${{ inputs.dry_run && '--dry-run --provenance=false' || '' }}
