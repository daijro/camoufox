[pytest]
# This suite has its own config on purpose: the Playwright suite's conftest.py
# (upstream's, see ../playwright/README.md) imports that suite's dependencies
# (pixelmatch, twisted, ...), which would make Camoufox's own tests unrunnable
# without them.
asyncio_mode = auto
markers =
    asyncio: async test, run by pytest-asyncio
addopts = -ra
