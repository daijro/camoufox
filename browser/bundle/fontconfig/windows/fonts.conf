<fontconfig>

<!-- Font directory list -->

	<dir prefix="cwd">fonts</dir>

<!--
  Names a real Windows machine RESOLVES to a different installed family (the
  GDI FontSubstitutes names plus the six Light/Semilight names that render
  their family's REGULAR face). They have no file of their own, so fontconfig
  never sees them; each rule rewrites the request to a bundled target.

  fontconfig resolves a family before the font allowlist sees it, and Camoufox
  has no per-launch fontconfig hook, so the rules are unconditional here and
  the names are instead ALWAYS reported: every one of them is in
  _ESSENTIAL_FONTS_WINDOWS (python/src/camoufox/fingerprints.py), which is what
  a real Windows install does too (every Windows box resolves all of them).
  Keep the three in step: this block, that constant, and fonts.json[win].
  Source of the mapping: ALIASES in scripts/gen-fonts-json.py, measured on two
  Windows machines. (No double hyphen inside an XML comment.)
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>Courier</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Courier New</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Helvetica</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Arial</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>MS Sans Serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Microsoft Sans Serif</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Small Fonts</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Arial</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>MS Serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Times New Roman</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Roman</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Times New Roman</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Times</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Times New Roman</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Calibri Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Calibri</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Candara Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Candara</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Corbel Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Corbel</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Leelawadee UI Semilight</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Leelawadee UI</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Nirmala Text Semilight</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Nirmala UI</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Nirmala UI Semilight</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Nirmala UI</string>
		</edit>
	</match>

<!--
  Accept deprecated 'mono' alias, replacing it with 'monospace'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>mono</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>monospace</string>
		</edit>
	</match>

<!--
  Accept alternate 'sans serif' spelling, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>sans-serif</string>
		</edit>
	</match>

<!--
  Accept deprecated 'sans' alias, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>sans-serif</string>
		</edit>
	</match>

<!--
  Windows font substitutions (HKLM\...\CurrentVersion\FontSubstitutes).
  "MS Shell Dlg 2" is not an installed family on Windows either; it is a
  registry substitution to Tahoma, and it is the family Gecko reports for
  -moz-button / -moz-field / -moz-list, i.e. the computed font of every
  button, input and select. Without the alias fontconfig resolves it to the
  default sans and every form control comes out the wrong size.
  (No "- -" inside an XML comment: it makes the whole file unparseable and
  fontconfig then silently falls back to system defaults for EVERY family.)
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>MS Shell Dlg 2</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Tahoma</string>
		</edit>
	</match>

<!--
  Map TTC weight-variant family names to base families.
  On macOS, TTC collections register each weight as a separate family name.
  On Linux, fontconfig only registers the base family.
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>PingFang HK Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>PingFang HK</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>PingFang SC Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>PingFang SC</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>PingFang TC Light</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>PingFang TC</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>InaiMathi Bold</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>InaiMathi</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Kohinoor Devanagari Medium</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Kohinoor Devanagari</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>American Typewriter Semibold</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>American Typewriter</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Futura Bold</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Futura</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Apple SD Gothic Neo ExtraBold</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Apple SD Gothic Neo</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>MuktaMahee Regular</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Mukta Mahee</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>STIX Two Math Regular</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>STIX Two Math</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>STIX Two Text Regular</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>STIX Two Text</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>Noto Sans Canadian Aboriginal Regular</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Noto Sans Canadian Aboriginal</string>
		</edit>
	</match>

<!--
  Block MONO from leaking as a Linux marker.
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>MONO</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>monospace</string>
		</edit>
	</match>

<!--
  Set our default generic families.
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans-serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Arial</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Times New Roman</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>monospace</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Consolas</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>system-ui</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Segoe UI</string>
		</edit>
	</match>
<!--
  cursive/fantasy generic mapping to match real Windows Firefox. Verified vs a
  Windows 11 host: cursive resolves to Comic Sans MS (measured 235.050) and fantasy
  resolves to the default sans-serif Arial (measured 224.133, == sans-serif),
  NOT Impact. Without these, both generics fell through to one shared fallback,
  so cursive===fantasy here but not on real Windows — a Linux-host tell.
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>cursive</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Comic Sans MS</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>fantasy</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Arial</string>
		</edit>
	</match>


<!-- Font cache directory list -->

	<cachedir prefix="xdg">fontconfig</cachedir>

	<config>
<!--
  Rescan configuration every 30 seconds when FcFontSetList is called
 -->
		<rescan>
			<int>30</int>
		</rescan>
	</config>

	<!-- Standardize rendering settings. -->
	<match target="pattern">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="autohint" mode="assign"><bool>false</bool></edit>
		<edit name="hinting" mode="assign"><bool>true</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
		<edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
	</match>
<!-- duplicate-face rejects: REMOVED 2026-09-23 -->
<!-- The 455 <glob> rejects that lived here are no longer needed. The bundle
     stores each face once, in a directory named for the set of OSes that use
     it (bundle/fonts/groups.json), and a launch is handed only the groups its
     claimed OS reads, so a face Windows must not see is not on the search path
     at all. Verified: 0 of the 243 formerly rejected basenames appear in any
     Windows group.

     Rejecting by <glob> was also unsound: 114 bundled filenames contain [ ]
     (e.g. ReemKufi[wght].ttf), which fontconfig parses as a character class,
     so those rejects silently matched nothing. Directory grouping has no
     equivalent failure mode. -->

<!-- BEGIN opsz instance families -->
	<!-- DirectWrite folds a variable font's named instances INTO the family when
	     they differ only in weight, width or slant (so `Bahnschrift Light` is not
	     a family on Windows, and a Windows 11 host confirms it absent), and gives every
	     other instance group its own GDI family. Sitka and Segoe UI Variable vary
	     on `opsz`, which no CSS style axis can express, so each optical size is
	     its own family there. Measured on a Windows 11 host: all six `Sitka *` and all three
	     `Segoe UI Variable *` names are present and answer identically under
	     every setting, while the bare `Sitka` and `Segoe UI Variable` are absent.
	     fontconfig publishes one family per FILE, so these rules add the names
	     Windows has.

	     APPEND ONLY. `assign_replace` on `family` at scan time also looked right
	     and cost 833 of 1510 faces across the whole bundle, not just these two
	     files, so it is not a spelling choice. The bare names stay in the
	     fontconfig list and are kept out of every manifest instead; an unreported
	     family is pruned by the whitelist, which is how `Sitka` has always read
	     absent.

	     Scan rules, not per-launch pattern rules: these are real FAMILIES, so the
	     whitelist prunes them by name like anything else. A pattern rule would
	     rewrite a request to a family the whitelist had already pruned, which
	     would bypass it.

	     NOTE FOR ANYONE EDITING THIS COMMENT: a double hyphen is illegal inside
	     an XML comment. One here made fontconfig reject the WHOLE generated file
	     and silently fall back to the system config, so the browser ran with no
	     bundle fonts at all and every measurement taken against it was void.
	     Keep in step with SCAN_FAMILIES in scripts/gen-fonts-json.py. -->
	<match target="scan">
		<test name="family"><string>Sitka</string></test>
		<edit name="family" mode="append"><string>Sitka Small</string></edit>
		<edit name="family" mode="append"><string>Sitka Subheading</string></edit>
		<edit name="family" mode="append"><string>Sitka Heading</string></edit>
		<edit name="family" mode="append"><string>Sitka Display</string></edit>
		<edit name="family" mode="append"><string>Sitka Banner</string></edit>
	</match>
	<match target="scan">
		<test name="family"><string>Segoe UI Variable</string></test>
		<edit name="family" mode="append"><string>Segoe UI Variable Small</string></edit>
		<edit name="family" mode="append"><string>Segoe UI Variable Text</string></edit>
		<edit name="family" mode="append"><string>Segoe UI Variable Display</string></edit>
	</match>
<!-- END opsz instance families -->

</fontconfig>
