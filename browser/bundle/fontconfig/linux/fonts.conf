<!--
  Set our default generic families.

  These are the families a real Ubuntu desktop resolves each generic to, NOT a
  standardized set. They were Arimo / Tinos / Cousine, inherited from the Tor
  Browser fonts.conf this file derives from, and they survived the switch of the
  Linux font bases off the Tor font set and onto Ubuntu/Mint defaults
  (scripts/data/font-manifests.json) — so every Linux identity reported an Ubuntu font list and
  then rendered every generic in a font Ubuntu does not ship. The default page
  font was the visible half of that; the metrics are the measurable half.

  Captured from a stock control on Ubuntu 26.04 LTS (fontconfig 2.17.1), the same
  host, same Firefox 152.0.3, measuring each generic from a page:

      sans-serif  Noto Sans          serif      Noto Serif
      monospace   DejaVu Sans Mono   cursive    Z003
      fantasy     Noto Sans (== sans-serif)     system-ui  Noto Sans

  system-ui needs no rule of its own: with no match it falls through to
  sans-serif, which is what the control shows. The bare default (no font-family
  at all) follows `serif` via font.default.x-western, so re-pointing serif moves
  the not-found fallback with it — also what the control shows.

  Both `lin` bases carry all three targets, so no draw can leave a generic
  without a face; the Linux marker fonts (_LINUX_MARKER_FONTS) pin that.

  Re-measure against a stock control after any change here. The Windows sibling
  (../windows/fonts.conf) was checked the same way against a Windows 11 host running stock
  Firefox 152.0.3 and is correct on all six — do not "fix" it to match this file.
-->
<!--
  cursive/fantasy generic mapping, the Linux sibling of the block in
  ../windows/fonts.conf. Without these both generics fall through to an
  arbitrary first-match in the bundle (Cascadia Code, a Windows font that the
  config.fonts whitelist then blocks), so cursive and fantasy landed on the
  font-not-found path and measured identically to each other, while stock
  Firefox on Linux yields cursive distinct and fantasy == sans-serif.

  Verified against a stock Firefox 152.0.3 control on the same host:
  `fc-match cursive` resolves to Z003 (URW Chancery, from urw-base35) and
  `fc-match fantasy` resolves to the default sans. Z003 is in the linux base
  manifest, so it is present for every identity (checked
  across 40 seeds); cursive does not silently collapse again on some draw.
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>cursive</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Z003</string>
		</edit>
	</match>
	<match target="pattern">
		<test qual="any" name="family">
			<string>fantasy</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>Noto Sans</string>
		</edit>
	</match>

<!-- Font cache directory list -->

	<cachedir prefix="xdg">fontconfig</cachedir>

	<config>
<!--
  Rescan configuration every 30 seconds when FcFontSetList is called
 -->
		<rescan>
			<int>30</int>
		</rescan>
	</config>

	<!-- Standardize rendering settings.

	     hintstyle is hintSLIGHT, not the hintfull this file inherited from the
	     Tor Browser config. hintfull rounds glyph advances to whole pixels, so
	     text width stops changing anywhere inside an integer-ppem bucket, and
	     that is measurable from content with no reference at all: just measure
	     the same string at 13, 13.125, 13.25, 13.375px and see one value
	     instead of four. Sundial's font-advance-ppem-quantized detector reads
	     exactly that, and stock Firefox 152.0.3 on the same Linux host does
	     NOT pin. Measured, same string, same sizes:

	         stock  "DejaVu Sans"  233 / 235.5 / 237.3333 / 240   (4 distinct)
	         before "DejaVu Sans"  240 / 240   / 240     / 240    (pinned)

	     hintslight uses the light autohinter, which only hints vertically and
	     leaves horizontal advances linear, which is what the host reports
	     (fc-match -v gives hintstyle: 1) and what every mainstream distro
	     defaults to. A Linux identity on a Linux host is supposed to BE the
	     truth of a Linux desktop, so matching that beats standardizing on a
	     value real Linux does not use.
	-->
	<match target="pattern">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
		<edit name="autohint" mode="assign"><bool>false</bool></edit>
		<edit name="hinting" mode="assign"><bool>true</bool></edit>
		<edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
		<edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
		<edit name="rgba" mode="assign"><const>none</const></edit>
	</match>


