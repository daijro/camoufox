// Theme: stock default ("System theme — auto"). The former forced
// "firefox-compact-dark" is a lightweight theme: :root[lwtheme] removes the
// 1 px nav-bar separator, so the chrome was 85 px tall where every stock
// Firefox on the same host measures 86 (outerHeight - innerHeight,
// mozInnerScreenY), and the theme is applied asynchronously after the first
// window, so a page open during startup saw the viewport resize by 1 px.
// Measured 2026-09-14 against stock 153 headless on Linux.

// Allow remote
defaultPref("devtools.debugger.remote-enabled", true);
defaultPref("devtools.debugger.prompt-connection", false);

// Playwright waits for Juggler's "listening to the pipe" line, which Juggler
// prints with dump(). Official builds turn dump() off by default.
defaultPref("browser.dom.window.dump.enabled", true);

// Dont restore sessions
defaultPref("browser.sessionstore.max_resumed_crashes", 0);
defaultPref("browser.sessionstore.restore_on_demand", false);
defaultPref("browser.sessionstore.restore_tabs_lazily", false);

// Firefox 158.0.1 (bug 2076558) turns this off on GTK, which also stops
// dependent windows being placed relative to their parent. Keep it on:
// window-position-wm-placement.patch already leaves independent windows to the
// window manager, so this keeps the placement Camoufox 158.0 shipped.
defaultPref("browser.load-xul-position.enabled", true);

// Allow pasting in console
defaultPref("devtools.selfxss.count", 100);

// WebRTC IP-leak hardening (daijro/camoufox#538).
// Camoufox already replaces the candidate IPs in the SDP layer
// (see webrtc-ip-spoofing.patch / WebRTCIPManager), but a regression
// somewhere between FF142 and FF146 means the real WAN/LAN IP can still
// reach the JS layer when the user is behind a proxy unless ICE itself
// is constrained. The pref defaults below force the proxy_only path
// for any proxied profile and prevent local host candidates from being
// gathered or surfaced.
//
//   * no_host = FALSE: KEEP the host candidate. A stock Firefox always emits a
//     host candidate (an mDNS <uuid>.local name + a srflx). Suppressing it
//     (no_host=true, the old setting) left a single-srflx shape that does NOT
//     match a real browser (foundation 1, no .local host) — a fingerprint tell.
//     obfuscate_host_addresses (below) replaces the real LAN IP with the
//     <uuid>.local mDNS name, so keeping host candidates leaks nothing while
//     restoring the stock two-candidate shape.
//   * default_address_only: only emit the default route address, no
//     enumeration of every interface.
//   * proxy_only_if_behind_proxy: when a SOCKS/HTTP proxy is configured,
//     no UDP goes around it. THIS is the pref that actually prevents the
//     real-IP leak: STUN, TURN and peer UDP go through a SOCKS5 proxy's UDP
//     relay (webrtc-socks5-udp.patch), so the srflx is the exit's real one.
//     Behind a proxy with no UDP relay no UDP leaves the box and no srflx
//     surfaces, as on a machine whose UDP is blocked.
//   * proxy_only_if_pbmode: same, for private-browsing windows.
//   * obfuscate_host_addresses: replace the host candidate's LAN IP with an
//     mDNS <uuid>.local name (keeps host candidates leak-free).
//   * relay_only stays opt-in — turning it on by default would break
//     legitimate WebRTC; the above prefs are sufficient to plug the
//     IP leak without forcing all traffic through a TURN server.
defaultPref("media.peerconnection.ice.no_host", false);
defaultPref("media.peerconnection.ice.default_address_only", true);
defaultPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);
defaultPref("media.peerconnection.ice.proxy_only_if_pbmode", true);
defaultPref("media.peerconnection.ice.obfuscate_host_addresses", true);

// Enable content isolation (WAFs can detect this!)
defaultPref("fission.autostart", true);
// fission.webContentIsolationStrategy keeps Firefox's value here; Juggler sets
// it to 0 (no out-of-process iframes) only when a driver is attached.

// Firefox's release rollouts. Stock Firefox on the release channel gets these
// from Nimbus (Remote Settings nimbus-desktop-experiments and
// nimbus-secure-experiments); Camoufox's update channel is "default", so no
// rollout ever targets it. Every 100% rollout that applies to release 159 and
// changes what a page or server sees is restored here as a default pref
// (checked against Remote Settings 2026-11-04; release-rollouts.py). Partial
// rollouts stay at Firefox's own defaults. software-h264-decode-pref-flip
// (media.gmp.decoder.enabled false) covered 158.0-158.0.4 only: 159 decodes
// H.264 through OpenH264 again, as its own default.
// compression-dictionaries-rollout-153-release (100%): stock answers
// Use-As-Dictionary with Available-Dictionary and dcb/dcz over HTTPS, and
// <link>.relList.supports("compression-dictionary") is true.
defaultPref("network.http.dictionaries.enable", true);

// Colour scheme follows the host like stock Firefox: pinning
// ui.systemUsesDarkTheme made prefers-color-scheme disagree with a dark
// desktop (measured on Windows 11, 2026-09-14). Spoof it per identity through
// the launcher instead when the identity is not the host.

