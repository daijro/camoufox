// network.cookie.cookieBehavior stays at Firefox's default (5, dynamic
// first-party isolation). Playwright sets 4 so storageState need not carry
// "thirdPartyCookie^" permissions, but a cross-site iframe can read the
// difference: document.hasStorageAccess() resolves true and first-party
// cookies/localStorage are visible inside the frame, where stock Firefox
// partitions them.

// Increase max number of child web processes so that new pages
// get a new process by default and we have a process isolation
// between pages from different contexts. If this becomes a performance
// issue we can povide custom '@mozilla.org/ipc/processselector;1'

// -------
// RoverfoxStorageManager now uses Firefox Preferences API for cross-process sync.
// No longer need processCount=1. Default processCount allows proper process isolation.
// -------

