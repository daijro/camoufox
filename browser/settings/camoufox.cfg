// Theme: stock default ("System theme — auto"). The former forced
// "firefox-compact-dark" is a lightweight theme: :root[lwtheme] removes the
// 1 px nav-bar separator, so the chrome was 85 px tall where every stock
// Firefox on the same host measures 86 (outerHeight - innerHeight,
// mozInnerScreenY), and the theme is applied asynchronously after the first
// window, so a page open during startup saw the viewport resize by 1 px.
// Measured 2026-09-14 against stock 153 headless on Linux.

// Allow remote
defaultPref("devtools.debugger.remote-enabled", true);
