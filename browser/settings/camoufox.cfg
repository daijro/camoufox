// Popup blocker: Firefox's default (ON), unlike Playwright and geckodriver,
// which both ship it off. With it off, a page that calls window.open() without
// user activation gets a window where stock gets null -- one bit, one line of
// JS, no permission and nothing the page has to wait for.
//
// The reason it used to be off is that turning it on takes window.open() from
// page.evaluate() with it (null, ~35 upstream tests). That is now handled
