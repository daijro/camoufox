// Speculative loading stays at Firefox's defaults. `<link rel=prefetch>` is
// page-readable: the prefetch is a real request, so it lands in the document's
// own PerformanceResourceTiming entries. Measured 2026-09-18 against stock
// 152.0.4 on the same host -- stock reported the entry (initiatorType "other",
// transferSize 200300), camoufox reported none, from three lines of page JS
// with no gesture and no permission. dns-prefetch is not directly readable but
// belongs to the same speculative surface (see also
// network.http.speculative-parallel-limit, restored for rel=preconnect).
defaultPref("browser.preferences.defaultPerformanceSettings.enabled", false);

// Turn off bfcache
// Source: https://github.com/Floorp-Projects/Floorp/issues/140
defaultPref("browser.sessionstore.max_tabs_undo", 0);
defaultPref("browser.sessionstore.max_windows_undo", 0);
defaultPref("browser.sessionstore.upgradeBackup.maxUpgradeBackups", 0);
// Do NOT set browser.sessionhistory.max_entries to 0. It does not disable
// bfcache -- fission.bfcacheInParent=false (set by Juggler for a driven
// browser) does that. What it does is leave the session history with no entries at all, so
// window.history.length reports 0. The HTML spec guarantees a browsing context
// always retains at least its current entry, so history.length >= 1 in every
// real browser: 0 is a zero-false-positive automation tell that any page script
// can read with no timing or heuristics. It also makes page.go_back() a silent
// no-op (#326, #196). Keep Firefox's stock default so the value, and its growth
// across navigations, matches a real browser.
defaultPref("browser.sessionhistory.max_entries", 50);
// bfcache and the memory cache keep Firefox's defaults
// (browser.sessionhistory.max_total_viewers, browser.cache.memory.enable).
// Juggler cannot report a bfcache restore, so a driven browser turns bfcache off
// with fission.bfcacheInParent=false (components/Juggler.js); that alone
// disables it -- docShell.disallowBFCache does not under SHIP (measured
// 2026-10-26). Without bfcache a same-origin navigation shows
// unloadEventStart > 0 and pageshow.persisted false.

// Session storage
defaultPref("browser.sessionstore.privacy_level", 2);

// Do not reopen windows on startup
defaultPref("privacy.clearOnShutdown.openWindows", true);

