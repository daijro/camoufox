// Storage quota is deliberately NOT pinned here. navigator.storage.estimate()
// .quota is min(disk capacity / 10, 10 GiB) and a fixed limit of 50 GiB -- the
// value this used to set -- is both a constant on every host and exactly
// nsRFPService::GetSpoofedStorageLimit(). The launcher derives the limit from
// the host's own disk instead (pythonlib utils._stock_profile_disk_capacity_kb),
// so a bare launch keeps Gecko's own measurement.

// Camoufox: the launcher's per-identity prefs (pythonlib firefox_user_prefs),
// applied at STARTUP. Playwright's non-persistent launch writes no user.js and
// only sends these through juggler's Browser.enable after startup, so a pref
// Gecko reads while starting up raced or never applied (intl.locale.requested vs
// the parent's pre-created string bundles; mirror-once prefs). Read last so an
// identity pref overrides a default above; Browser.enable later re-sets the same
// values, which is a no-op. See pythonlib utils.get_pref_env_vars.
(function () {
  let raw = "";
  for (let i = 1; ; i++) {
    const part = getenv("CAMOU_PREFS_" + i);
    if (!part) {
      break;
    }
    raw += part;
  }
  if (!raw) {
    return;
  }
  let prefs;
  try {
    prefs = JSON.parse(raw);
  } catch (e) {
    return;
  }
  for (const name of Object.keys(prefs)) {
    try {
      defaultPref(name, prefs[name]);
    } catch (e) {}
  }
})();
