# 24h quarantine on anything freshly published, as supply-chain cover.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  # Pinned to a git commit until camoucore 0.2.0 is on npm; a git dependency
  # builds itself (tsc) on install.
  - camoucore
  - esbuild
  - playwright-core

nodeLinker: hoisted
linkWorkspacePackages: true
preferWorkspacePackages: true
publicHoistPattern:
    - "*"
